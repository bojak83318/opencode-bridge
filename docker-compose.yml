version: '3.8'

services:
  opencode-bridge:
    build: .
    environment:
      - OPENCODE_KEY=kimera
      - OPENCODE_BASE_URL=http://127.0.0.1:4096
    restart: unless-stopped
    container_name: opencode-bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"   # Bridge API
      - "4096:4096" # OpenCode WebUI
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - opencode-bridge
    restart: unless-stopped
    container_name: nginx-sidecar
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: opencode-network