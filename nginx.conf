events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # OpenCode Bridge proxy
        location / {
            proxy_pass http://opencode-bridge:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Optimized for Server-Sent Events (SSE) streaming
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
        }

        # Tavily sidecar proxy (assuming it's on the host or another container)
        location /tavily/ {
            proxy_pass http://host.docker.internal:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            proxy_pass http://opencode-bridge:8083/health;
        }
    }

    # OpenCode WebUI Server
    server {
        listen 4096;
        server_name _;

        location / {
            proxy_pass http://opencode-bridge:4096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # WebUI WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable buffering for real-time interaction
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Increase buffer sizes for large payloads
            proxy_buffer_size 256k;
            proxy_buffers 4 512k;
            proxy_busy_buffers_size 512k;

            proxy_read_timeout 86400; # 24h for long-lived WebSockets
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            
            # Allow large uploads if needed
            client_max_body_size 100M;
        }
    }
}